name: Hardware

on:
  push:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '**/fp-lib-table'
      - '**/sym-lib-table'
      - 'kicadlibs/**'
      - 'kibot.yaml'
      - '.github/workflows/hardware.yml'
  pull_request:
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '**/fp-lib-table'
      - '**/sym-lib-table'
      - 'kicadlibs/**'
      - 'kibot.yaml'
      - '.github/workflows/hardware.yml'

jobs:
  boards:
    name: Find boards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # Same board list the local tooling uses (sync_libs.boards), so a
        # moved or new board is picked up without editing this file.
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          sys.path.insert(0, ".github/scripts")
          from sync_libs import ROOT, boards
          SKIP = {"ali/v2/template"}  # a starting point, not a board to fabricate
          inc = []
          for d in boards():
              if d.relative_to(ROOT).as_posix() in SKIP:
                  continue
              stem = next(d.glob("*.kicad_pro")).stem
              rel = d.relative_to(ROOT).as_posix()
              inc.append({"name": rel.replace("/", "-"), "dir": rel,
                          "sch": f"{stem}.kicad_sch", "pcb": f"{stem}.kicad_pcb"})
          print("matrix=" + json.dumps({"include": inc}))
          PY

  kibot:
    name: KiBot - ${{ matrix.name }}
    needs: boards
    runs-on: ubuntu-latest
    env:
      # Library root for projects that use ${APRL_LIBS} instead of counting ../
      # KiBot runs in a container with the checkout mounted at /github/workspace.
      APRL_LIBS: /github/workspace/kicadlibs

    strategy:
      fail-fast: false   # run all boards even if one fails
      matrix: ${{ fromJSON(needs.boards.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git log` in set_text_variables works
          fetch-depth: 0

      - name: Run KiBot
        uses: INTI-CMNB/KiBot@v2_k10
        with:
          config:  kibot.yaml
          schema:  ${{ matrix.dir }}/${{ matrix.sch }}
          board:   ${{ matrix.dir }}/${{ matrix.pcb }}
          dir:     outputs/${{ matrix.name }}
          verbose: 0

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        if: always()   # upload even on ERC/DRC failure so errors are visible
        with:
          name: kibot-${{ matrix.name }}
          path: outputs/${{ matrix.name }}/
          if-no-files-found: warn
